name: Supabase keep-alive

# Free-tier Supabase projects pause after 7 days with no activity, then can be
# permanently deleted 90 days after that. This workflow pings the project twice a
# week (Mon + Thu) so the 7-day inactivity timer never elapses. A single anon REST
# request counts as project activity — RLS still returns nothing, so no data leaks.
#
# Setup (one time):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     SUPABASE_URL       = https://<your-ref>.supabase.co
#     SUPABASE_ANON_KEY  = <your anon / publishable key>
#   Scheduled runs fire only from the default branch, so this file must land on it.

on:
  schedule:
    - cron: "0 9 * * 1,4" # 09:00 UTC every Monday and Thursday (max gap 4 days < 7)
  workflow_dispatch: {}    # lets you trigger a run by hand to test it

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (counts as activity)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/topics?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          # 200 (empty due to RLS) and 401/403 all mean the request reached the DB,
          # which is what resets the inactivity timer. Only a network failure is fatal.
          if [ "$code" = "000" ]; then
            echo "No response from Supabase — check SUPABASE_URL secret." >&2
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

name: Supabase keep-alive

# Free-tier Supabase projects are paused when the database sees too little activity
# over a rolling 7-day window. Supabase's guidance is explicit: "typically a few user
# requests to the database each day over the previous week is enough to keep the
# project from being paused" (https://supabase.com/docs/guides/platform/free-project-pausing).
# Two pings a week — the schedule this workflow used before — was NOT enough: every
# ping returned HTTP 200 and the project was paused anyway on 2026-08-17.
# So now: three runs a day, three table reads per run.
#
# Setup (one time):
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#     SUPABASE_URL       = https://<project-ref>.supabase.co
#     SUPABASE_ANON_KEY  = <anon / publishable key>
#
# Notes:
#   * Scheduled runs only fire from the default branch, so this file must live there.
#   * GitHub disables scheduled workflows in repos with no commits for 60 days; a push
#     or a manual "Run workflow" re-arms them.
#   * Reads go through RLS with the anon key, so nothing is exposed — an empty result
#     is still a real query against the database, which is what counts as activity.

on:
  schedule:
    - cron: "17 5 * * *"  # 05:17 UTC
    - cron: "23 12 * * *" # 12:23 UTC
    - cron: "41 19 * * *" # 19:41 UTC
  workflow_dispatch: {}   # lets you trigger a run by hand to test it

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase REST (counts as database activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # GitHub runs this step as 'bash -e {0}'. Without 'set +e' the first failing
          # curl kills the step instantly with a bare "Process completed with exit code
          # 6" and no diagnosis at all — which is exactly what happened on 2026-08-17.
          set +e
          set -u

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY are not set on this repository."
            exit 1
          fi

          base="${SUPABASE_URL%/}"
          reached=0
          dns_fail=0
          problems=""

          for table in topics profiles essays; do
            ok=0
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
                "$base/rest/v1/$table?select=*&limit=1" \
                -H "apikey: $SUPABASE_ANON_KEY" \
                -H "Authorization: Bearer $SUPABASE_ANON_KEY")
              rc=$?
              # 200 (empty under RLS), 401 and 403 all mean the request reached the
              # database, which is what resets the inactivity timer. A 5xx comes from
              # Cloudflare while the project itself is down/booting — that does not count.
              if [ "$rc" -eq 0 ] && [ "$code" != "000" ] && [ "$code" -lt 500 ]; then
                echo "$table -> HTTP $code"
                ok=1
                break
              fi
              if [ "$rc" -eq 6 ]; then
                echo "$table -> hostname does not resolve (curl exit 6), attempt $attempt/3"
                dns_fail=1
              else
                echo "$table -> curl exit $rc / HTTP $code, attempt $attempt/3"
              fi
              [ "$attempt" -lt 3 ] && sleep 10
            done
            if [ "$ok" -eq 1 ]; then
              reached=$((reached + 1))
            else
              problems="$problems $table"
            fi
          done

          if [ "$reached" -eq 0 ]; then
            if [ "$dns_fail" -eq 1 ]; then
              echo "::error::The Supabase hostname does not resolve. For Supabase this almost"
              echo "::error::always means the project is PAUSED or deleted, not a network glitch."
              echo "::error::Fix: open https://supabase.com/dashboard and restore the project"
              echo "::error::(possible for 90 days after it is paused). If the project is fine,"
              echo "::error::check that SUPABASE_URL is exactly https://<project-ref>.supabase.co"
            else
              echo "::error::Supabase answered but the database served nothing (5xx / timeout)."
              echo "::error::The project is probably still booting after a restore, or is down."
              echo "::error::Check https://supabase.com/dashboard and https://status.supabase.com"
            fi
            exit 1
          fi

          if [ -n "$problems" ]; then
            echo "::warning::These reads did not go through:$problems"
          fi
          echo "Keep-alive OK — $reached/3 reads reached the database."
